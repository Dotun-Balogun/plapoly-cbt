# ---------------------------------------------------
# Database connection
# Change username/password to match your local MySQL.
# The database "psp_cbt" is created automatically the
# first time the app runs (createDatabaseIfNotExist=true).
# ---------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/psp_cbt?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------
# JPA / Hibernate
# ddl-auto=update means Hibernate creates/updates the
# database tables automatically from the @Entity classes.
# ---------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------
# Thymeleaf (set cache=false so template edits show up
# immediately without restarting the app)
# ---------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------
# Server
# ---------------------------------------------------
server.port=${PORT:8080}
