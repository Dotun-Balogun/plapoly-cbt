<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Login - PSP CBT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card shadow-sm auth-card" style="width: 400px;">
        <div class="card-body p-4">
            <div class="text-center mb-3">
                <img src="/images/logo.jpg" alt="Logo" class="logo mb-2">
                <h4 class="mb-0"><i class="bi bi-mortarboard text-brand"></i> Student Login</h4>
            </div>
            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
            <form method="post" th:action="@{/student/login}">
                <div class="mb-3">
                    <label class="form-label">Matriculation Number</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" name="matricNumber" class="form-control"
                               placeholder="PSP/ICT/CSE/ND/24/0004" required autofocus>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Login</button>
            </form>
            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none">&larr; Back</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
