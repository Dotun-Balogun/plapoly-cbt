<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${exam.title} + ' - PSP CBT'">Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

<div class="container-fluid exam-topbar text-white py-2 px-4 d-flex justify-content-between align-items-center flex-wrap">
    <div class="d-flex align-items-center gap-2">
        <img src="/images/logo.jpg" alt="Logo" style="height:28px;">
        <strong>COMPUTER-BASED TEST</strong>
        <span class="ms-3" th:text="${student.fullName}"></span>
        <span class="ms-2 text-muted" th:text="'(' + ${student.matricNumber} + ')'"></span>
    </div>
    <div>
        <span th:text="${exam.title}"></span>
        <span id="timer" class="badge bg-danger ms-3 fs-6"><i class="bi bi-stopwatch"></i> <span id="timerValue">--:--</span></span>
    </div>
</div>

<div class="container my-4">
    <div class="row">
        <!-- Questions -->
        <div class="col-md-9">
            <div class="card">
                <div class="card-body">
                    <div th:each="a, iter : ${answers}"
                         class="question-block"
                         th:data-index="${iter.index}"
                         th:style="${iter.index} == 0 ? '' : 'display:none;'">

                        <h6 th:text="'Question ' + (${iter.index} + 1) + ' of ' + ${#lists.size(answers)}"></h6>
                        <p class="fs-5" th:text="${a.question.questionText}"></p>

                        <div class="form-check mb-2">
                            <input class="form-check-input answer-radio" type="radio"
                                   th:name="'q' + ${a.question.id}" value="A"
                                   th:id="'q' + ${a.question.id} + 'A'"
                                   th:data-question-id="${a.question.id}"
                                   th:checked="${a.selectedOption == 'A'}">
                            <label class="form-check-label" th:for="'q' + ${a.question.id} + 'A'"
                                   th:text="'A. ' + ${a.question.optionA}"></label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input answer-radio" type="radio"
                                   th:name="'q' + ${a.question.id}" value="B"
                                   th:id="'q' + ${a.question.id} + 'B'"
                                   th:data-question-id="${a.question.id}"
                                   th:checked="${a.selectedOption == 'B'}">
                            <label class="form-check-label" th:for="'q' + ${a.question.id} + 'B'"
                                   th:text="'B. ' + ${a.question.optionB}"></label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input answer-radio" type="radio"
                                   th:name="'q' + ${a.question.id}" value="C"
                                   th:id="'q' + ${a.question.id} + 'C'"
                                   th:data-question-id="${a.question.id}"
                                   th:checked="${a.selectedOption == 'C'}">
                            <label class="form-check-label" th:for="'q' + ${a.question.id} + 'C'"
                                   th:text="'C. ' + ${a.question.optionC}"></label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input answer-radio" type="radio"
                                   th:name="'q' + ${a.question.id}" value="D"
                                   th:id="'q' + ${a.question.id} + 'D'"
                                   th:data-question-id="${a.question.id}"
                                   th:checked="${a.selectedOption == 'D'}">
                            <label class="form-check-label" th:for="'q' + ${a.question.id} + 'D'"
                                   th:text="'D. ' + ${a.question.optionD}"></label>
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between">
                        <button id="prevBtn" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Previous</button>
                        <button id="nextBtn" class="btn btn-outline-secondary">Next <i class="bi bi-arrow-right"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigator -->
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h6>Question Navigator</h6>
                    <div id="navigator" class="d-flex flex-wrap gap-1 mb-3">
                        <button th:each="a, iter : ${answers}"
                                type="button"
                                class="btn btn-sm nav-btn"
                                th:classappend="${a.selectedOption != null} ? 'btn-success' : 'btn-outline-secondary'"
                                th:data-index="${iter.index}"
                                th:text="${iter.index} + 1"></button>
                    </div>
                    <button id="submitBtn" class="btn btn-danger w-100"><i class="bi bi-send-check"></i> SUBMIT EXAM</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation modal -->
<div class="modal" id="confirmModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body">
                <p>Are you sure you want to submit your examination?</p>
                <p id="answeredSummary"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelSubmit">Cancel</button>
                <form th:action="@{/student/exam/{id}/submit(id=${attempt.id})}" method="post" id="submitForm">
                    <button type="submit" class="btn btn-danger">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const attemptId = /*[[${attempt.id}]]*/ 0;
    let secondsRemaining = /*[[${secondsRemaining}]]*/ 0;
</script>
<script src="/js/exam-timer.js"></script>
</body>
</html>
