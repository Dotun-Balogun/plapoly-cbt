<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Available Exams - PSP CBT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 mb-4">
    <div class="container-fluid">
        <span class="navbar-brand d-flex align-items-center">
            <img src="/images/logo.jpg" alt="Logo" style="height:32px;" class="me-2">
            PSP CBT
        </span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#studentNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="studentNav">
            <span class="navbar-text text-white me-3" th:text="${student.fullName} + ' (' + ${student.matricNumber} + ')'"></span>
            <a href="/student/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
</nav>
<div class="container">
    <h3 class="mb-3"><i class="bi bi-clipboard-check text-brand"></i> Available Examinations</h3>
    <div th:if="${#lists.isEmpty(exams)}" class="alert alert-info">No exams are available right now.</div>

    <div class="row g-3">
        <div class="col-md-6" th:each="e : ${exams}">
            <div class="card">
                <div class="card-body">
                    <h5 th:text="${e.title}"></h5>
                    <p class="text-muted mb-1" th:text="${e.course.code} + ' - ' + ${e.course.title}"></p>
                    <p class="mb-2"><i class="bi bi-clock"></i> <span th:text="${e.durationMinutes} + ' minutes'"></span></p>

                    <div th:with="attempt=${attemptsByExam.get(e.id)}">
                        <div th:if="${attempt != null and attempt.submitted}">
                            <span class="badge bg-success mb-2"><i class="bi bi-check-circle"></i> Completed</span><br>
                            <a th:href="@{/student/result/{id}(id=${attempt.id})}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-eye"></i> View Result</a>
                        </div>
                        <div th:if="${attempt == null or !attempt.submitted}">
                            <form th:action="@{/student/exams/{id}/start(id=${e.id})}" method="post">
                                <button class="btn btn-primary btn-sm">
                                    <i class="bi bi-play-fill"></i>
                                    <span th:text="${attempt != null} ? 'Resume Exam' : 'Start Exam'"></span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
