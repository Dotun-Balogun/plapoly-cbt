<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Result - PSP CBT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card shadow-sm auth-card" style="width: 420px;">
        <div class="card-body text-center p-4">
            <img src="/images/logo.jpg" alt="Logo" class="logo mb-2">
            <h4 th:text="${attempt.exam.title}"></h4>
            <p class="text-muted" th:text="${attempt.student.fullName} + ' - ' + ${attempt.student.matricNumber}"></p>

            <div class="display-4 my-3 text-brand fw-bold" th:text="${attempt.grade}"></div>
            <p><i class="bi bi-check2-square"></i> Score: <strong th:text="${attempt.score} + ' / ' + ${attempt.totalMarks}"></strong></p>
            <p><i class="bi bi-percent"></i> Percentage: <strong th:text="${#numbers.formatDecimal(attempt.percentage, 1, 1)} + '%'"></strong></p>

            <a href="/student/exams" class="btn btn-primary mt-3"><i class="bi bi-arrow-left"></i> Back to Exams</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
