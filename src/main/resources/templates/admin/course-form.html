<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Form - PSP CBT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{admin/fragments :: nav}"></div>
<div class="container" style="max-width: 600px;">
    <h3 class="mb-3" th:text="${course.id} != null ? 'Edit Course' : 'Add Course'">Add Course</h3>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
    <form method="post" th:action="@{/admin/courses/save}" th:object="${course}">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Course Code (e.g. CSE 201)</label>
            <input type="text" th:field="*{code}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Course Title</label>
            <input type="text" th:field="*{title}" class="form-control" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Department</label>
                <input type="text" th:field="*{department}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Programme</label>
                <input type="text" th:field="*{programme}" class="form-control">
            </div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
        <a href="/admin/courses" class="btn btn-link">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
