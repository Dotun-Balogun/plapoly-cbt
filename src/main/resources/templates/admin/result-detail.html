<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Result Detail - PSP CBT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{admin/fragments :: nav}"></div>
<div class="container" style="max-width: 600px;">
    <a href="/admin/results" class="text-muted small">&larr; Back to Results</a>
    <div class="card mt-2">
        <div class="card-body">
            <h4 th:text="${attempt.student.fullName}"></h4>
            <p class="text-muted" th:text="${attempt.student.matricNumber}"></p>
            <table class="table table-sm">
                <tr><th>Exam</th><td th:text="${attempt.exam.title}"></td></tr>
                <tr><th>Total Questions</th><td th:text="${attempt.totalMarks}"></td></tr>
                <tr><th>Score</th><td th:text="${attempt.score} + '/' + ${attempt.totalMarks}"></td></tr>
                <tr><th>Percentage</th><td th:text="${#numbers.formatDecimal(attempt.percentage, 1, 1)} + '%'"></td></tr>
                <tr><th>Grade</th><td th:text="${attempt.grade}"></td></tr>
                <tr><th>Started</th><td th:text="${#temporals.format(attempt.startTime, 'dd-MM-yyyy HH:mm')}"></td></tr>
                <tr><th>Submitted</th><td th:text="${#temporals.format(attempt.submittedAt, 'dd-MM-yyyy HH:mm')}"></td></tr>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
