<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exams - PSP CBT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{admin/fragments :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-clipboard-check text-brand"></i> Exams</h3>
        <a href="/admin/exams/new" class="btn btn-primary"><i class="bi bi-file-earmark-plus"></i> Create Exam</a>
    </div>
    <div class="table-responsive">
<table class="table table-bordered bg-white">
        <thead>
        <tr><th>Title</th><th>Course</th><th>Duration</th><th>Questions</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="e : ${exams}">
            <td th:text="${e.title}"></td>
            <td th:text="${e.course.code}"></td>
            <td th:text="${e.durationMinutes} + ' min'"></td>
            <td th:text="${questionRepository.findByExamId(e.id).size()}"></td>
            <td>
                <span th:if="${e.status.name() == 'ACTIVE'}" class="badge bg-success">Active</span>
                <span th:unless="${e.status.name() == 'ACTIVE'}" class="badge bg-secondary">Inactive</span>
            </td>
            <td>
                <a th:href="@{/admin/exams/{id}/edit(id=${e.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                <a th:href="@{/admin/exams/{id}/questions(id=${e.id})}" class="btn btn-sm btn-outline-dark"><i class="bi bi-question-circle"></i> Questions</a>
                <form th:action="@{/admin/exams/{id}/toggle(id=${e.id})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-warning"
                            th:text="${e.status.name() == 'ACTIVE'} ? 'Deactivate' : 'Activate'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
