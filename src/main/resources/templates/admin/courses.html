<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Courses - PSP CBT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{admin/fragments :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-journal-bookmark text-brand"></i> Courses</h3>
        <a href="/admin/courses/new" class="btn btn-primary"><i class="bi bi-journal-plus"></i> Add Course</a>
    </div>
    <div class="table-responsive">
<table class="table table-bordered bg-white">
        <thead>
        <tr><th>Code</th><th>Title</th><th>Department</th><th>Programme</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${courses}">
            <td th:text="${c.code}"></td>
            <td th:text="${c.title}"></td>
            <td th:text="${c.department}"></td>
            <td th:text="${c.programme}"></td>
            <td>
                <span th:if="${c.active}" class="badge bg-success">Active</span>
                <span th:unless="${c.active}" class="badge bg-secondary">Inactive</span>
            </td>
            <td>
                <a th:href="@{/admin/courses/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/admin/courses/{id}/toggle(id=${c.id})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-warning" th:text="${c.active} ? 'Deactivate' : 'Activate'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
