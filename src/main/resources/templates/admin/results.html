<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Results - PSP CBT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{admin/fragments :: nav}"></div>
<div class="container">

    <h3 class="mb-3"><i class="bi bi-hourglass-split text-brand"></i> In Progress</h3>
    <p class="text-muted small">Candidates currently mid-exam, or started by mistake. Reset deletes their
        attempt completely so they can start fresh.</p>
    <div class="table-responsive mb-5">
    <table class="table table-bordered align-middle" th:if="${not #lists.isEmpty(inProgress)}">
        <thead>
        <tr><th>Student</th><th>Matric No.</th><th>Exam</th><th>Started</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="a : ${inProgress}">
            <td th:text="${a.student.fullName}"></td>
            <td th:text="${a.student.matricNumber}"></td>
            <td th:text="${a.exam.title}"></td>
            <td th:text="${#temporals.format(a.startTime, 'dd-MM-yyyy HH:mm')}"></td>
            <td>
                <form th:action="@{/admin/results/{id}/reset(id=${a.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Reset this attempt? The candidate will be able to start over.');">
                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-arrow-clockwise"></i> Reset</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
    <div th:if="${#lists.isEmpty(inProgress)}" class="alert alert-light border mb-5">No exams currently in progress.</div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0"><i class="bi bi-bar-chart-line text-brand"></i> Completed Results</h3>
        <a th:href="@{/admin/results/export(q=${q}, examId=${examId})}" class="btn btn-outline-success">
            <i class="bi bi-filetype-csv"></i> Export CSV</a>
    </div>
    <form method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Search name or matric no.">
        </div>
        <div class="col-auto">
            <select name="examId" class="form-select">
                <option value="">All Exams</option>
                <option th:each="e : ${exams}" th:value="${e.id}" th:text="${e.title}"
                        th:selected="${examId != null and examId == e.id}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary"><i class="bi bi-funnel"></i> Filter</button>
        </div>
    </form>

    <div class="table-responsive">
    <table class="table table-bordered align-middle">
        <thead>
        <tr>
            <th>Student</th><th>Matric No.</th><th>Exam</th><th>Score</th>
            <th>Percentage</th><th>Grade</th><th>Date Taken</th><th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${results}">
            <td th:text="${r.student.fullName}"></td>
            <td th:text="${r.student.matricNumber}"></td>
            <td th:text="${r.exam.title}"></td>
            <td th:text="${r.score} + '/' + ${r.totalMarks}"></td>
            <td th:text="${#numbers.formatDecimal(r.percentage, 1, 1)} + '%'"></td>
            <td><span class="badge bg-dark" th:text="${r.grade}"></span></td>
            <td th:text="${#temporals.format(r.submittedAt, 'dd-MM-yyyy HH:mm')}"></td>
            <td class="text-nowrap">
                <a th:href="@{/admin/results/{id}(id=${r.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></a>
                <form th:action="@{/admin/results/{id}/reset(id=${r.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Reset this result? The score will be deleted and the candidate can retake the exam.');">
                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-arrow-clockwise"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
