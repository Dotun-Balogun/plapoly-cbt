<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exam Form - PSP CBT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{admin/fragments :: nav}"></div>
<div class="container" style="max-width: 600px;">
    <h3 class="mb-3" th:text="${exam.id} != null ? 'Edit Exam' : 'Create Exam'">Create Exam</h3>
    <form method="post" th:action="@{/admin/exams/save}" th:object="${exam}">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Exam Title</label>
            <input type="text" th:field="*{title}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Course</label>
            <select name="courseId" class="form-select" required>
                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.code} + ' - ' + ${c.title}"
                        th:selected="${exam.course != null and exam.course.id == c.id}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Duration (minutes)</label>
            <input type="number" th:field="*{durationMinutes}" class="form-control" min="1" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select th:field="*{status}" class="form-select">
                <option value="INACTIVE">Inactive</option>
                <option value="ACTIVE">Active</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
        <a href="/admin/exams" class="btn btn-link">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
