<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - PSP CBT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{admin/fragments :: nav}"></div>
<div class="container">
    <h3 class="mb-4"><i class="bi bi-speedometer2 text-brand"></i> Dashboard</h3>
    <div class="row g-3">
        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
                <i class="bi bi-people"></i>
                <div>
                    <div class="fs-3 fw-bold" th:text="${totalStudents}">0</div>
                    <div class="text-muted small">Total Students</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
                <i class="bi bi-clipboard-check"></i>
                <div>
                    <div class="fs-3 fw-bold" th:text="${totalExams}">0</div>
                    <div class="text-muted small">Total Exams</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
                <i class="bi bi-question-circle"></i>
                <div>
                    <div class="fs-3 fw-bold" th:text="${totalQuestions}">0</div>
                    <div class="text-muted small">Total Questions</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
                <i class="bi bi-check2-circle"></i>
                <div>
                    <div class="fs-3 fw-bold" th:text="${completedExams}">0</div>
                    <div class="text-muted small">Completed Exams</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-3 col-6">
            <a href="/admin/students/new" class="btn btn-outline-dark w-100 py-3"><i class="bi bi-person-plus d-block fs-4 mb-1"></i> Add Student</a>
        </div>
        <div class="col-md-3 col-6">
            <a href="/admin/courses/new" class="btn btn-outline-dark w-100 py-3"><i class="bi bi-journal-plus d-block fs-4 mb-1"></i> Add Course</a>
        </div>
        <div class="col-md-3 col-6">
            <a href="/admin/exams/new" class="btn btn-outline-dark w-100 py-3"><i class="bi bi-file-earmark-plus d-block fs-4 mb-1"></i> Create Exam</a>
        </div>
        <div class="col-md-3 col-6">
            <a href="/admin/results" class="btn btn-outline-dark w-100 py-3"><i class="bi bi-bar-chart-line d-block fs-4 mb-1"></i> View Results</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
