<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Questions - PSP CBT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{admin/fragments :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 th:text="'Questions - ' + ${exam.title}">Questions</h3>
            <a href="/admin/exams" class="text-muted small">&larr; Back to Exams</a>
        </div>
        <a th:href="@{/admin/exams/{id}/questions/new(id=${exam.id})}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Add Question</a>
    </div>
    <div class="table-responsive">
<table class="table table-bordered bg-white">
        <thead>
        <tr><th>#</th><th>Question</th><th>Correct</th><th>Marks</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="q, iter : ${questions}">
            <td th:text="${iter.count}"></td>
            <td th:text="${q.questionText}"></td>
            <td th:text="${q.correctOption}"></td>
            <td th:text="${q.marks}"></td>
            <td>
                <a th:href="@{/admin/exams/{eid}/questions/{qid}/edit(eid=${exam.id}, qid=${q.id})}"
                   class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/admin/exams/{eid}/questions/{qid}/delete(eid=${exam.id}, qid=${q.id})}"
                      method="post" class="d-inline" onsubmit="return confirm('Delete this question?');">
                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
