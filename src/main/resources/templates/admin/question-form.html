<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Question Form - PSP CBT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{admin/fragments :: nav}"></div>
<div class="container" style="max-width: 650px;">
    <h3 class="mb-3" th:text="${question.id} != null ? 'Edit Question' : 'Add Question'">Add Question</h3>
    <form method="post" th:action="@{/admin/exams/{id}/questions/save(id=${exam.id})}" th:object="${question}">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Question Text</label>
            <textarea th:field="*{questionText}" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Option A</label>
            <input type="text" th:field="*{optionA}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Option B</label>
            <input type="text" th:field="*{optionB}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Option C</label>
            <input type="text" th:field="*{optionC}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Option D</label>
            <input type="text" th:field="*{optionD}" class="form-control" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Correct Option</label>
                <select th:field="*{correctOption}" class="form-select" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Marks</label>
                <input type="number" th:field="*{marks}" class="form-control" min="1" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
        <a th:href="@{/admin/exams/{id}/questions(id=${exam.id})}" class="btn btn-link">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
