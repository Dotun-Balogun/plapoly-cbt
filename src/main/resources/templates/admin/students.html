<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students - PSP CBT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{admin/fragments :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-people text-brand"></i> Students</h3>
        <a href="/admin/students/new" class="btn btn-primary"><i class="bi bi-person-plus"></i> Add Student</a>
    </div>

    <form method="get" class="mb-3 d-flex gap-2" style="max-width: 400px;">
        <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Search name or matric no.">
        <button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
    </form>

    <div class="table-responsive">
<table class="table table-bordered bg-white">
        <thead>
        <tr>
            <th>Full Name</th>
            <th>Matric Number</th>
            <th>Department</th>
            <th>Programme</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.fullName}"></td>
            <td th:text="${s.matricNumber}"></td>
            <td th:text="${s.department}"></td>
            <td th:text="${s.programme}"></td>
            <td>
                <span th:if="${s.active}" class="badge bg-success">Active</span>
                <span th:unless="${s.active}" class="badge bg-secondary">Deactivated</span>
            </td>
            <td>
                <a th:href="@{/admin/students/{id}/edit(id=${s.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/admin/students/{id}/toggle(id=${s.id})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-warning" th:text="${s.active} ? 'Deactivate' : 'Reactivate'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
